[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-agent"
version = "0.1.0"
description = "Generate and upload a daily one-minute YouTube Shorts-style video."
requires-python = ">=3.11"
dependencies = [
    "edge-tts",
    "google-api-python-client",
    "google-auth-oauthlib",
    "moviepy",
    "Pillow",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
youtube-daily = "youtube_daily_automation.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
