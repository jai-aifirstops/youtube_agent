name: Daily YouTube documentary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Generate and upload documentary
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Daily Documentary' }}
          DOCUMENTARY_TOPIC: ${{ vars.DOCUMENTARY_TOPIC || '' }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'wikimedia' }}
          EDGE_TTS_RATE: ${{ vars.EDGE_TTS_RATE || '+0%' }}
          MUSIC_VOLUME: ${{ vars.MUSIC_VOLUME || '0.18' }}
          TRANSITION_STYLE: ${{ vars.TRANSITION_STYLE || 'crossfade' }}
        run: youtube-daily run --upload
